<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght=300;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@900&display=swap');

:root {
    --desktop-width: 1240px;
    --gold-color: #D4AF37;
    --shein-pink: #fdf0f3;
}

/* වටේ තියෙන අනවශ්‍ය Gap සහ Padding සම්පූර්ණයෙන්ම අයින් කිරීම */
.overall-scaler {
    font-family: 'Poppins', sans-serif;
    margin: 0px auto !important; 
    padding: 0px !important; 
    background: #ffffff;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden !important; 
    box-sizing: border-box;
}

::-webkit-scrollbar { display: none; }

/* Desktop Wrapper Margins & Paddings */
.shein-layout-wrapper {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 15px; 
    margin: 0px auto !important; 
    padding: 0px !important;
    width: var(--desktop-width);
    box-sizing: border-box;
}

/* MAIN SLIDER WITH NAVIGATION CONTROLS */
.main-promo-slider { 
    background: #f5f5f5; 
    border-radius: 0px; 
    width: 660px; 
    height: 225px; 
    overflow: hidden; 
    position: relative;
    margin: 0px !important;
    padding: 0px !important;
}

.slider-track { 
    display: flex; 
    width: 100%; 
    height: 100%; 
    transition: transform 0.5s ease-in-out; 
}

.dynamic-slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0;
    box-sizing: border-box;
    position: relative;
    background-size: cover;
    background-position: center;
}

/* SHEIN STYLE SLIDER CONTENT WRAPPER */
.slide-inner-content {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    box-sizing: border-box;
    background: linear-gradient(90deg, rgba(255,255,255,0.9) 35%, rgba(255,255,255,0.2) 100%);
}

/* NAVIGATION ARROWS (SHEIN STYLE) */
.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    border: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    transition: 0.3s;
}
.nav-btn:hover { background: rgba(255, 255, 255, 0.9); }
.nav-btn.prev { left: 15px; }
.nav-btn.next { right: 15px; }
.nav-btn svg { width: 20px; height: 20px; fill: #222; }

/* SLIDER DOTS (SHEIN STYLE) */
.slider-dots-container {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 10;
}
.slider-dot {
    width: 8px;
    height: 8px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
}
.slider-dot.active {
    background: #000000;
    width: 18px;
    border-radius: 4px;
}

.slide-text-area { width: 45%; text-align: left; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; }
.slide-text-area h2 { font-size: 26px; font-weight: 900; color: #000; margin: 0; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.5px; }
.slide-text-area p { font-size: 13px; font-weight: 700; color: #ff3f6c; margin: 6px 0; text-transform: uppercase; }

.shop-now-btn { background: #000; color: #fff; padding: 8px 22px; border-radius: 0px; text-decoration: none; font-weight: 700; font-size: 11px; display: inline-block; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
.shop-now-btn:hover { background: #333; }

.slide-product-area { display: flex; gap: 12px; width: 55%; justify-content: flex-end; }
.product-card { width: 130px; height: 185px; position: relative; border-radius: 4px; overflow: hidden; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.06); cursor: pointer; }
.product-card img { width: 100%; height: 100%; object-fit: cover; }

/* PRICE TAG OVERLAY (SHEIN BANNER STYLE) */
.price-tag { 
    position: absolute; bottom: 8px; left: 50%; 
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.9); padding: 2px 8px; 
    border-radius: 20px; display: flex; flex-direction: row; 
    align-items: center; gap: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
    width: max-content;
}
.price-tag .amount { color: #ff3f6c; font-weight: 800; font-size: 12px; }

/* SIDE BANNERS */
.side-banners { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
.mini-banner { position: relative; width: 258px !important; height: 67px !important; border-radius: 0px; overflow: hidden; display: block; background: #e0e0e0; text-decoration: none; box-sizing: border-box; }
.mini-banner img { width: 258px !important; height: 67px !important; object-fit: cover; transition: 0.5s; opacity: 0; min-height: 67px; }

.left-banner .banner-label { 
    position: absolute; top: 0; left: 0; height: 100%; width: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
    color: #fff !important; font-weight: 700; font-size: 14px; 
    display: flex; align-items: center; padding-left: 20px;
    z-index: 2; text-transform: uppercase; letter-spacing: 1px; 
    box-sizing: border-box;
}

.right-banner::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); z-index: 1; }
.right-banner .banner-label { 
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #fff !important; z-index: 2; text-align: center; width: 100%;
    font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
}
.font-romwe { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 18px; letter-spacing: 2px; }
.font-emery { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 12px; letter-spacing: 4px; line-height: 1.2; }
.font-motf { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 20px; letter-spacing: 2px; }

/* HOME GRID AND COLLECTION LIST GAP */
.shein-nav-container { 
    margin: 20px auto 0px auto !important; 
    padding: 0px !important;
    width: 100%; 
    max-width: var(--desktop-width); 
    box-sizing: border-box;
}
.shein-collections-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 20px 15px; width: 100%; }
.shein-item { text-decoration: none !important; display: flex; flex-direction: column; align-items: center; }
.circle-img-wrap { width: 110px; height: 110px; border-radius: 50%; overflow: hidden; border: 1px solid #e0e0e0; margin-bottom: 8px; }
.circle-img-wrap img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: 0.5s; }
.shein-label { font-size: 11px; font-weight: 600; color: #222; text-align: center; height: 28px; line-height: 1.2; overflow: hidden; text-transform: uppercase; }

/* MOBILE RESPONSIVE - FIXED TO PREVENT BREAKING */
@media screen and (max-width: 768px) {
    .overall-scaler { padding: 0px !important; }
    .shein-layout-wrapper { flex-direction: column; width: 100%; padding: 0px !important; margin: 0px auto !important; gap: 0px !important; }
    .side-banners { display: none !important; }
    
    .main-promo-slider { width: 100%; height: 180px !important; order: -1; margin: 0px auto !important; border-radius: 0px; }
    .nav-btn { width: 28px; height: 28px; }
    .nav-btn.prev { left: 8px; }
    .nav-btn.next { right: 8px; }
    .nav-btn svg { width: 14px; height: 14px; }

    .slide-inner-content { padding: 0 20px; background: linear-gradient(90deg, rgba(255,255,255,0.95) 45%, rgba(255,255,255,0.4) 100%); }
    .slide-text-area { width: 50% !important; }
    .slide-text-area h2 { font-size: 16px; }
    .slide-text-area p { font-size: 9px; margin: 2px 0; }
    .shop-now-btn { padding: 5px 12px; font-size: 8px; margin-top: 4px; }
    
    .slide-product-area { width: 50% !important; gap: 6px; }
    .product-card { width: 75px !important; height: 115px !important; }
    .price-tag { padding: 1px 5px; bottom: 4px; }
    .price-tag .amount { font-size: 9px; }
    
    .slider-dots-container { bottom: 6px; gap: 4px; }
    .slider-dot { width: 5px; height: 5px; }
    .slider-dot.active { width: 12px; }
    
    .shein-nav-container { margin: 15px auto 0px auto !important; padding: 0px !important; } 
    .shein-collections-grid { grid-template-columns: repeat(4, 1fr); gap: 12px 4px; }
    .circle-img-wrap { width: 75px; height: 75px; }
}
</style>

<div class="overall-scaler">
    <div class="shein-layout-wrapper">
        <div class="side-banners">
            <a href="/collections/all" class="mini-banner left-banner">
                <img class="banner-auto-img" id="img-side-1">
                <div class="banner-label">Hot Sellers</div>
            </a>
            <a href="/collections/new-arrivals" class="mini-banner left-banner">
                <img class="banner-auto-img" id="img-side-2">
                <div class="banner-label">New Arrivals</div>
            </a>
            <a href="/collections/tops-2" class="mini-banner left-banner">
                <img class="banner-auto-img" id="img-side-3">
                <div class="banner-label">Trending Now</div>
            </a>
        </div>

        <div class="main-promo-slider" id="mainSlider">
            <button class="nav-btn prev" onclick="plusSlides(-1)">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="nav-btn next" onclick="plusSlides(1)">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>

            <div class="slider-track" id="dynamicTrack"></div>
            <div class="slider-dots-container" id="dotsContainer"></div>
        </div>

        <div class="side-banners">
            <a href="/collections/women-clothing-2" class="mini-banner right-banner">
                <img class="banner-auto-img" id="img-side-4">
                <div class="banner-label font-romwe">ROMWE</div>
            </a>
            <a href="/collections/curve" class="mini-banner right-banner">
                <img class="banner-auto-img" id="img-side-5">
                <div class="banner-label font-emery">EMERY<br>ROSE</div>
            </a>
            <a href="/collections/tops-2" class="mini-banner right-banner">
                <img class="banner-auto-img" id="img-side-6">
                <div class="banner-label font-motf">MOTF</div>
            </a>
        </div>
    </div>

    <div class="shein-nav-container">
        <div class="shein-collections-grid">
            <a href="/collections/men-clothing" class="shein-item"><div class="circle-img-wrap"><img id="img-men-clothing"></div><span class="shein-label">Men Clothing</span></a>
            <a href="/collections/women-clothing-2" class="shein-item"><div class="circle-img-wrap"><img id="img-women-clothing-2"></div><span class="shein-label">Women Clothing</span></a>
            <a href="/collections/curve" class="shein-item"><div class="circle-img-wrap"><img id="img-curve"></div><span class="shein-label">Curve</span></a>
            <a href="/collections/kids" class="shein-item"><div class="circle-img-wrap"><img id="img-kids"></div><span class="shein-label">Kids</span></a>
            <a href="/collections/beachwear" class="shein-item"><div class="circle-img-wrap"><img id="img-beachwear"></div><span class="shein-label">Beachwear</span></a>
            <a href="/collections/tops-2" class="shein-item"><div class="circle-img-wrap"><img id="img-tops-2"></div><span class="shein-label">Tops</span></a>
            <a href="/collections/dresses-2" class="shein-item"><div class="circle-img-wrap"><img id="img-dresses-2"></div><span class="shein-label">Dresses</span></a>
            <a href="/collections/phones-accessories" class="shein-item"><div class="circle-img-wrap"><img id="img-phones-accessories"></div><span class="shein-label">Phones & Accessories</span></a>
            <a href="/collections/shoes-accessories" class="shein-item"><div class="circle-img-wrap"><img id="img-shoes-accessories"></div><span class="shein-label">Shoes Accessories</span></a>
            <a href="/collections/jewelry-accessories" class="shein-item"><div class="circle-img-wrap"><img id="img-jewelry-accessories"></div><span class="shein-label">Jewelry Accessories</span></a>
            <a href="/collections/beauty" class="shein-item"><div class="circle-img-wrap"><img id="img-beauty"></div><span class="shein-label">Beauty</span></a>
            <a href="/collections/sports" class="shein-item"><div class="circle-img-wrap"><img id="img-sports"></div><span class="shein-label">Sports</span></a>
            <a href="/collections/baby" class="shein-item"><div class="circle-img-wrap"><img id="img-baby"></div><span class="shein-label">Baby</span></a>
            <a href="/collections/underwear-sleepwear" class="shein-item"><div class="circle-img-wrap"><img id="img-underwear-sleepwear"></div><span class="shein-label">Underwear & Sleepwear</span></a>
            <a href="/collections/electronics" class="shein-item"><div class="circle-img-wrap"><img id="img-electronics"></div><span class="shein-label">Electronics</span></a>
            <a href="/collections/hand-bags" class="shein-item"><div class="circle-img-wrap"><img id="img-hand-bags"></div><span class="shein-label">Hand Bags</span></a>
        </div>
    </div>
</div>

<script>
let slideIndex = 0;
let totalDynamicSlides = 0;

const luxuryHeadlines = [
    { main: "SEASONAL<br>TRENDS", sub: "Up to 80% OFF" },
    { main: "SUMMER<br>LINEUP", sub: "Fresh Fits Daily" },
    { main: "ROMANTIC<br>DRESSES", sub: "New Arrival Collection" },
    { main: "WEDDING<br>ERA", sub: "Celebrate in Style" }
];

async function initAdlestDynamicSlider() {
    const collectionHandle = 'dresses-2'; 
    const track = document.getElementById('dynamicTrack');
    const dotsContainer = document.getElementById('dotsContainer');
    const bannerImgs = document.querySelectorAll('.banner-auto-img');
    
    try {
        const res = await fetch(`/collections/${collectionHandle}`);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const allProducts = Array.from(doc.querySelectorAll('a[href*="/products/"]'));
        
        bannerImgs.forEach((img, index) => {
            if (allProducts[index]) {
                const productImg = allProducts[index].querySelector('img');
                if (productImg) {
                    img.src = productImg.src;
                    img.style.opacity = '1';
                }
            }
        });

        let currentSlideCount = 0;
        for (let i = 0; i < allProducts.length && currentSlideCount < 5; i += 2) {
            if (allProducts[i]) {
                const slide = document.createElement('div');
                slide.className = 'dynamic-slide';
                
                let cardsHTML = '';
                const pair = allProducts.slice(i, i + 2);
                let firstImgSrc = '';
                
                pair.forEach((link, pIdx) => {
                    const imgEl = link.querySelector('img');
                    if(imgEl) {
                        const img = imgEl.src;
                        if(pIdx === 0) firstImgSrc = img;
                        
                        let realPrice = 15.99;
                        const priceMatch = link.innerText.match(/\d+\.\d+/);
                        if (priceMatch) realPrice = parseFloat(priceMatch[0]);
                        const finalPrice = realPrice.toFixed(2);

                        cardsHTML += `
                            <div class="product-card" onclick="window.location.href='${link.getAttribute('href')}'">
                                <img src="${img}">
                                <div class="price-tag">
                                    <span class="amount">$${finalPrice}</span>
                                </div>
                            </div>
                        `;
                    }
                });

                // Background එකට පළවෙනි item එකේ ඉමේජ් එක බ්ලර් කරලා දාලා SHEIN ලුක් එක ගන්නවා
                slide.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)), url('${firstImgSrc}')`;
                
                const head = luxuryHeadlines[currentSlideCount % luxuryHeadlines.length];
                slide.innerHTML = `
                    <div class="slide-inner-content">
                        <div class="slide-text-area">
                            <h2>${head.main}</h2>
                            <p>${head.sub}</p>
                            <a href="/collections/dresses-2" class="shop-now-btn">SHOP NOW</a>
                        </div>
                        <div class="slide-product-area">${cardsHTML}</div>
                    </div>
                `;
                track.appendChild(slide);
                
                // Dot එකක් නිර්මාණය කිරීම
                const dot = document.createElement('div');
                dot.className = `slider-dot ${currentSlideCount === 0 ? 'active' : ''}`;
                dot.setAttribute('onclick', `currentSlide(${currentSlideCount})`);
                dotsContainer.appendChild(dot);
                
                currentSlideCount++;
            }
        }
        totalDynamicSlides = currentSlideCount;
    } catch (e) { console.log("Slider DOM Parser Error:", e); }
    
    if(totalDynamicSlides > 0) setInterval(() => plusSlides(1), 4000);
}

function updateDots() {
    const dots = document.querySelectorAll('.slider-dot');
    dots.forEach((dot, idx) => {
        if(idx === slideIndex) {
            dot.classList.add('active');
        } else {
            dot.classList.remove('active');
        }
    });
}

function plusSlides(n) {
    if (totalDynamicSlides === 0) return;
    slideIndex = (slideIndex + n + totalDynamicSlides) % totalDynamicSlides;
    document.getElementById('dynamicTrack').style.transform = `translateX(-${slideIndex * 100}%)`;
    updateDots();
}

function currentSlide(n) {
    slideIndex = n;
    document.getElementById('dynamicTrack').style.transform = `translateX(-${slideIndex * 100}%)`;
    updateDots();
}

// OPTIMIZED SYNC TECHNOLOGY FOR 16 CIRCLES
async function syncCircles() {
    const colList = [
        'men-clothing', 'women-clothing-2', 'curve', 'kids', 
        'beachwear', 'tops-2', 'dresses-2', 'phones-accessories', 
        'shoes-accessories', 'jewelry-accessories', 'beauty', 'sports', 
        'baby', 'underwear-sleepwear', 'electronics', 'hand-bags'
    ];

    await Promise.all(colList.map(async (c) => {
        try {
            const r = await fetch(`/collections/${c}`);
            if (!r.ok) return;
            const t = await r.text();
            const d = new DOMParser().parseFromString(t, 'text/html');
            const i = d.querySelector('a[href*="/products/"] img');
            const target = document.getElementById(`img-${c}`);
            if (i && target) { 
                target.src = i.src; 
                target.style.opacity = '1'; 
            }
        } catch (e) { console.log(`Error loading circle for ${c}:`, e); }
    }));
}

window.addEventListener('DOMContentLoaded', () => {
    initAdlestDynamicSlider();
    syncCircles();
});
</script>
